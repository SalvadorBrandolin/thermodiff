name: Tox

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test-linux:

    runs-on: ubuntu-24.04  # setup-fortran has no gcc "latest" for ubuntu-26.04 yet
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version}}
      - name: Install pandoc
        run: sudo apt-get install pandoc
      - name: Set up gfortran
        id: setup-fortran
        uses: fortran-lang/setup-fortran@v1
        # On Linux the action installs gcc from the ubuntu-toolchain-r PPA,
        # which sometimes answers 503. Do not fail the job here: the next
        # step falls back to the gfortran of the runner image or Ubuntu.
        continue-on-error: true
        with:
          compiler: gcc
          version: 'latest'
      - name: Fall back to the runner's or Ubuntu's gfortran
        if: steps.setup-fortran.outcome != 'success'
        run: |
          set -euo pipefail
          # Drop the PPA the action added, so apt does not retry it.
          sudo rm -f /etc/apt/sources.list.d/*ubuntu-toolchain-r*
          compiler=""
          for candidate in gfortran-14 gfortran-13 gfortran-12; do
            if command -v "$candidate" > /dev/null; then
              compiler="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$compiler" ]; then
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install -y \
              --no-install-recommends gfortran
            compiler="$(command -v gfortran)"
          fi
          # tox passes PATH but not FC: expose the compiler as `gfortran`.
          mkdir -p "$RUNNER_TEMP/fc-bin"
          ln -sf "$compiler" "$RUNNER_TEMP/fc-bin/gfortran"
          echo "$RUNNER_TEMP/fc-bin" >> "$GITHUB_PATH"
          echo "FC=$RUNNER_TEMP/fc-bin/gfortran" >> "$GITHUB_ENV"
          echo "Using $compiler"
      - name: Check gfortran
        run: |
          set -euo pipefail
          gfortran --version
          printf 'program t\nprint *, 1\nend program t\n' > "$RUNNER_TEMP/t.f90"
          gfortran "$RUNNER_TEMP/t.f90" -o "$RUNNER_TEMP/t"
          "$RUNNER_TEMP/t"
      - name: Install tox
        run: pip install tox tox-gh-actions
      - name: Test with tox
        run: tox -r

  test-windows:

    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version}}
          architecture: x64
      - name: Install pandoc
        run: choco install pandoc
      - name: Set up gfortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 'latest'
      - name: Install tox
        run: pip install tox tox-gh-actions
      - name: Test with tox
        run: tox -r

  test-macos:

    runs-on: macOS-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version}}
      - name: Install pandoc
        run: brew install pandoc
      - name: Set up gfortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 'latest'
      - name: Install tox
        run: pip install tox tox-gh-actions
      - name: Test with tox
        run: tox -r
