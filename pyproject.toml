[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
name = "thermodiff"
requires-python = ">=3.10"
version = "1.6.0"
authors = [{name = "Brandolín, Salvador Eduardo", email = "salvadorebrandolin@unc.edu.ar"}]
license = {text = "MIT License"}
readme = "README.md"
description = "A lightweight Python package designed to simplify the symbolic differentiation and manipulation of thermodynamic expressions using SymPy."
keywords = ["Thermodynamics", "Analytical differentiation", "Derivatives", "Equations of state"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

urls = {Homepage = "https://github.com/SalvadorBrandolin/thermodiff"}

dependencies = [
    'sympy>=1.14.0',
]

[project.scripts]
thermodiff-model = "thermodiff.model.cli:main"
thermodiff-gui = "thermodiff.gui.cli:main"

[project.optional-dependencies]
gui = ["streamlit>=1.30", "pandas"]

[tool.setuptools.packages.find]
include = ["thermodiff*"]

[tool.pytest.ini_options]
markers = [
    "thesis: tests that need models or data outside the repository (deselected with -m 'not thesis')",
]

[tool.black]
line-length = 79
target-version = ["py312"]

# The Streamlit application is a declarative UI script that can only run
# with the optional ``gui`` extra, so it is not part of the standard test
# run.  The testable helpers live in thermodiff/gui/logic.py.
[tool.coverage.run]
omit = [
    "thermodiff/gui/app.py",
]

